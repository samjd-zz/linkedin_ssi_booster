services:
  # ── FLUX.1-schnell Service ────────────────────────────────────────────────
  # This is the heavy-lifter. Only starts with --profile full
  flux-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: full_build # <--- Triggers the "CPU Slam" build stage that compiles the GPU-accelerated llama-cpp-python wheel
    container_name: ssi_booster_flux
    profiles: [ "full" ]
    volumes:
      - ./models/flux:/app/models/flux:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped

  # ── Ollama LLM server ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ssi_booster_ollama
    profiles: [ "core", "full" ]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama model initialiser ──────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: ssi_booster_ollama_init
    profiles: [ "core", "full" ]
    depends_on:
      ollama:
        condition: service_healthy
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_NUM_PARALLEL: 1
    entrypoint: >
      sh -c "
        MODEL=$${OLLAMA_MODEL:-llama3.2}
        echo \"[ollama-init] Pulling model: $$MODEL\";
        ollama pull $$MODEL;
        FALLBACK=$${OLLAMA_MODEL_FALLBACK:-};
        if [ -n \"$$FALLBACK\" ]; then
          echo \"[ollama-init] Pulling fallback model: $$FALLBACK\";
          ollama pull $$FALLBACK;
        fi;
        echo \"[ollama-init] Done.\"
      "
    restart: "no"

  # ── Wyoming Piper TTS server ──────────────────────────────────────────────
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: ssi_booster_piper
    profiles: [ "core", "full" ]
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - ./models/piper:/data
    command: --voice en_US-libritts_r-medium
    healthcheck:
      # The 'printf' check is the most reliable for this slim image
      test: [ "CMD-SHELL", "printf '' > /dev/tcp/127.0.0.1/10200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      # 120s gives plenty of time for that first-run voice download
      start_period: 120s

  # The "Init Container" for downloading models
  setup-models:
    image: alpine:latest
    container_name: ssi_booster_model_setup
    volumes:
      # 1. Map the host storage to the container download path
      - ./models/flux:/app/models/flux
      # 2. Map your local scripts folder so the container can run the .sh file
      - ./scripts:/app/scripts:ro
      # 3. Map the .env file so the script can read your CIVITAI_API_KEY
      - ./.env:/app/.env:ro
    # Install curl/bash and run the script
    command: >
      sh -c "
        apk add --no-cache curl bash && 
        chmod +x /app/scripts/download-flux1-schnell-Q4_K_S.sh && 
        /app/scripts/download-flux1-schnell-Q4_K_S.sh
      "
    environment:
      - CIVITAI_API_KEY=${CIVITAI_API_KEY}

  # ── LinkedIn SSI Booster application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: core_base # <--- ONLY builds the light stuff for the core profile, skipping the heavy GPU dependencies
    container_name: ssi_booster_app
    profiles: [ "core", "full" ]
    depends_on:
      # setup-models continues in the background, which is fine since it just 
      # needs the models to be present before it starts generating images
      setup-models:
        condition: service_started
      ollama:
        condition: service_healthy
      piper:
        condition: service_started
    env_file: .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      WYOMING_PIPER_HOST: piper
      WYOMING_PIPER_PORT: 10200
      FLUX_SERVICE_URL: http://flux-app:5000
    volumes:
      - ./data:/app/data
      - ./yt-vid-data:/app/yt-vid-data
      - ./content_calendar.py:/app/content_calendar.py:ro
      - ./models/flux:/app/models/flux:ro
    stdin_open: true
    tty: true
    command: [ "python", "main.py", "--help" ]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    devices:
      - /dev/snd:/dev/snd
    group_add:
      - audio

volumes:
  ollama_data:
