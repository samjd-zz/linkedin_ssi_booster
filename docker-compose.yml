  # ── FLUX.1-schnell model downloader ───────────────────────────────────────
  # One-shot: downloads the GGUF weights from Civitai into ./models/flux/
  # Run manually: docker compose run --rm flux-init
  # Runs automatically under --profile full before flux-app starts.
  flux-init:
    image: alpine:latest
    container_name: ssi_booster_flux_init
    profiles: [ "full" ]
    volumes:
      - ./models/flux:/app/models/flux
      - ./scripts:/app/scripts:ro
    command: >
      sh -c "
        apk add --no-cache curl bash &&
        /app/scripts/download-flux1-schnell-Q4_K_S.sh
      "
    environment:
      - CIVITAI_API_KEY=${CIVITAI_API_KEY}
    restart: "no"

  # ── FLUX.1-schnell inference service ──────────────────────────────────────
  # Compiles llama-cpp-python with CUDA. Only starts with --profile full.
  flux-app:
    build:
      context: .
      dockerfile: Dockerfile
      target: full_build
    container_name: ssi_booster_flux
    profiles: [ "full" ]
    depends_on:
      flux-init:
        condition: service_completed_successfully
    volumes:
      - ./models/flux:/app/models/flux:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    restart: unless-stopped

  # ── PostgreSQL Database ────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: ssi_booster_postgres
    profiles: [ "core", "full" ]
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ssi_booster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-ssi_booster}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ssi_booster}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama LLM server ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ssi_booster_ollama
    profiles: [ "core", "full" ]
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Ollama model initialiser ──────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:latest
    container_name: ssi_booster_ollama_init
    profiles: [ "core", "full" ]
    depends_on:
      ollama:
        condition: service_healthy
    env_file: .env
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_NUM_PARALLEL: 1
    entrypoint: >
      sh -c "
        MODEL=$${OLLAMA_MODEL:-llama3.2}
        echo \"[ollama-init] Pulling model: $$MODEL\";
        ollama pull $$MODEL;
        FALLBACK=$${OLLAMA_MODEL_FALLBACK:-};
        if [ -n \"$$FALLBACK\" ]; then
          echo \"[ollama-init] Pulling fallback model: $$FALLBACK\";
          ollama pull $$FALLBACK;
        fi;
        echo \"[ollama-init] Done.\"
      "
    restart: "no"

  # ── Wyoming Piper TTS server ──────────────────────────────────────────────
  piper:
    image: rhasspy/wyoming-piper:latest
    container_name: ssi_booster_piper
    profiles: [ "core", "full" ]
    restart: unless-stopped
    ports:
      - "10200:10200"
    volumes:
      - ./models/piper:/data
    command: --voice en_US-libritts_r-medium
    healthcheck:
      # The 'printf' check is the most reliable for this slim image
      test: [ "CMD-SHELL", "printf '' > /dev/tcp/127.0.0.1/10200 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      # 120s gives plenty of time for that first-run voice download
      start_period: 120s

  # ── LinkedIn SSI Booster application ──────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: core_base
    container_name: ssi_booster_app
    profiles: [ "core", "full" ]
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_healthy
      piper:
        condition: service_started
      # strudel-music-server:
      #   condition: service_started
      flux-app:
        condition: service_started
        required: false # only present under --profile full; ignored under --profile core
    env_file: .env
    environment:
      - PULSE_SERVER=unix:${PULSE_RUNTIME_DIR:-/run/user/1000/pulse}/native
      - OLLAMA_BASE_URL=http://ollama:11434
      - WYOMING_PIPER_HOST=piper
      - WYOMING_PIPER_PORT=10200
      - FLUX_SERVICE_URL=http://flux-app:5000
      # - STRUDEL_MCP_URL=http://strudel-music-server:3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-ssi_booster}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-ssi_booster}
    volumes:
      - ${PULSE_RUNTIME_DIR:-/run/user/1000/pulse}/native:${PULSE_RUNTIME_DIR:-/run/user/1000/pulse}/native
      - ~/.config/pulse/cookie:/root/.pulse-cookie:ro
      - ./data:/app/data
      - ./yt-vid-data:/app/yt-vid-data
      - ./content_calendar.py:/app/content_calendar.py:ro
      - ./models/flux:/app/models/flux:ro
    stdin_open: true
    tty: true
    command: [ "python", "main.py", "--help" ]
    restart: "no"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]
    group_add:
      - audio

volumes:
  ollama_data:
  postgres_data:
