# Intel GPU override for Windows WSL 2 / Docker Desktop.
# The WSL GPU bridge requires privileged access and the /usr/lib/wsl runtime.
services:
  ollama:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    privileged: true
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl
    # No group_add: this image's /etc/group has no video/render entries;
    # privileged + /dev/dri passthrough is sufficient for GPU access.
    environment:
      - DEVICE=iGPU
      - OLLAMA_NUM_GPU=999
      - ZES_ENABLE_SYSMAN=1
      - OLLAMA_HOST=0.0.0.0:11434
    entrypoint:
      - /bin/bash
      - -c
      - |
        source ipex-llm-init --gpu --device iGPU &&
        mkdir -p /llm/ollama &&
        cd /llm/ollama &&
        init-ollama &&
        ./ollama serve
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:11434/api/tags || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  ollama-init:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    privileged: true
    devices:
      - "/dev/dri:/dev/dri"
    volumes:
      - /usr/lib/wsl:/usr/lib/wsl
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_NUM_PARALLEL: 1
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        mkdir -p /llm/ollama
        cd /llm/ollama
        init-ollama
        export PATH="/llm/ollama:$$PATH"
        exec sh /opt/ensure-ollama-models.sh